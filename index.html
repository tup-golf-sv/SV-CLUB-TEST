<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>SV CLUB TEST</title><style>*{box-sizing:border-box}body{margin:0;background:#07140f;color:#eaf6ef;font-family:Arial,sans-serif;padding:12px}h2{font-size:19px}button{background:#234c3a;color:white;border:1px solid #5b8b71;border-radius:9px;padding:13px 10px;font-size:15px;font-weight:bold}.bar{display:flex;flex-wrap:wrap;gap:7px;margin:12px 0}#stage{position:relative;width:100%;background:black;aspect-ratio:3/4;max-height:70vh;overflow:hidden}video,canvas{position:absolute;width:100%;height:100%;inset:0;object-fit:contain}canvas{touch-action:none}#status{white-space:pre-wrap;line-height:1.5;color:#d4e8da;font-size:13px;padding:12px;background:#12271d;border-radius:8px}</style></head><body><h2>SV MOBILE · 클럽헤드 추적 TEST</h2><p>운영본과 분리된 HTTPS 테스트. 카메라 실행 후 클럽헤드를 터치하세요.</p><div class="bar"><button id="start">카메라 시작</button><button id="flip">전·후면 전환</button><button id="load">영상 불러오기</button><button id="toggle">궤적 ON</button><button id="reset">초기화</button></div><input id="file" type="file" accept="video/*" hidden><div id="stage"><video id="video" autoplay muted playsinline></video><canvas id="overlay"></canvas></div><p id="status">대기 중 · 카메라 사용에는 브라우저 권한이 필요합니다.</p><script>
const v=document.getElementById('video'),c=document.getElementById('overlay'),ctx=c.getContext('2d'),status=document.getElementById('status'),tmp=document.createElement('canvas');tmp.width=320;tmp.height=240;const t=tmp.getContext('2d',{willReadFrequently:true});let stream=null,front=false,show=true,track=null,points=[],last=0,frame=null,source='';const log=s=>status.textContent=s;
function size(){c.width=c.clientWidth*devicePixelRatio;c.height=c.clientHeight*devicePixelRatio}addEventListener('resize',size);size();
function stop(){if(stream){stream.getTracks().forEach(x=>x.stop());stream=null}v.pause();if(source){URL.revokeObjectURL(source);source=''}}
async function camera(){stop();track=null;points=[];try{if(!isSecureContext||!navigator.mediaDevices?.getUserMedia)throw Error('카메라 API 사용 불가. HTTPS 주소로 접속하세요.');stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:front?'user':'environment'},width:{ideal:1280},height:{ideal:720}}});v.srcObject=stream;await v.play();log('카메라 연결 성공. 클럽헤드를 화면에서 터치하세요.')}catch(e){log('카메라 오류: '+e.name+' / '+e.message+'\n주소: '+location.protocol+'//'+location.host)}}
document.getElementById('start').onclick=camera;document.getElementById('flip').onclick=()=>{front=!front;camera()};document.getElementById('load').onclick=()=>document.getElementById('file').click();document.getElementById('file').onchange=async e=>{const f=e.target.files[0];if(!f)return;stop();track=null;points=[];source=URL.createObjectURL(f);v.srcObject=null;v.src=source;try{await v.play();log('영상 재생 중. 클럽헤드를 터치하세요.')}catch(err){log('영상 오류: '+err.message)}};document.getElementById('toggle').onclick=e=>{show=!show;e.target.textContent='궤적 '+(show?'ON':'OFF')};document.getElementById('reset').onclick=()=>{track=null;points=[];log('추적 초기화')};
function rect(){const vw=v.videoWidth,vh=v.videoHeight,sw=c.width,sh=c.height;if(!vw||!vh)return null;const k=Math.min(sw/vw,sh/vh),w=vw*k,h=vh*k;return {x:(sw-w)/2,y:(sh-h)/2,w,h,vw,vh}}
c.addEventListener('pointerdown',e=>{const r=rect();if(!r)return;const b=c.getBoundingClientRect(),x=(e.clientX-b.left)*c.width/b.width,y=(e.clientY-b.top)*c.height/b.height;const px=Math.round((x-r.x)/r.w*320),py=Math.round((y-r.y)/r.h*240);if(px<10||py<10||px>310||py>230)return;try{t.drawImage(v,0,0,320,240);const im=t.getImageData(px-7,py-7,14,14);track={x:px,y:py,template:im.data.slice()};points=[[px,py]];log('클럽헤드 추적 시작 · 터치 위치를 영상 패턴으로 추적합니다.')}catch(err){log('영상 픽셀 접근 오류: '+err.message)}});
function score(data,x,y,ref){let sum=0;for(let j=0;j<14;j+=2)for(let i=0;i<14;i+=2){const a=((y+j)*320+x+i)*4,b=(j*14+i)*4;sum+=Math.abs(data[a]-ref[b])+Math.abs(data[a+1]-ref[b+1])+Math.abs(data[a+2]-ref[b+2])}return sum}
function tick(ts){requestAnimationFrame(tick);if(ts-last<65)return;last=ts;ctx.clearRect(0,0,c.width,c.height);const r=rect();if(!r||v.readyState<2)return;if(track){try{t.drawImage(v,0,0,320,240);const data=t.getImageData(0,0,320,240).data;let best=Infinity,bx=track.x,by=track.y;for(let y=Math.max(0,track.y-28);y<=Math.min(226,track.y+28);y+=2)for(let x=Math.max(0,track.x-28);x<=Math.min(306,track.x+28);x+=2){const z=score(data,x,y,track.template);if(z<best){best=z;bx=x;by=y}}if(best<16000){track.x=bx;track.y=by;points.push([bx+7,by+7]);if(points.length>220)points.shift()}else{log('추적 신뢰도 낮음 · 클럽헤드를 다시 터치하세요.');track=null}}catch(e){log('추적 오류: '+e.message);track=null}}
if(show&&points.length){ctx.lineWidth=2*devicePixelRatio;ctx.lineJoin='round';ctx.lineCap='round';for(let i=1;i<points.length;i++){ctx.strokeStyle=i<points.length*.5?'#48b8ff':'#ff6b6b';ctx.beginPath();ctx.moveTo(r.x+points[i-1][0]/320*r.w,r.y+points[i-1][1]/240*r.h);ctx.lineTo(r.x+points[i][0]/320*r.w,r.y+points[i][1]/240*r.h);ctx.stroke()}}if(track){ctx.strokeStyle='#c4ff66';ctx.lineWidth=2*devicePixelRatio;ctx.beginPath();ctx.arc(r.x+(track.x+7)/320*r.w,r.y+(track.y+7)/240*r.h,12*devicePixelRatio,0,Math.PI*2);ctx.stroke()}}
requestAnimationFrame(tick);log('독립 테스트 준비 완료 · HTTPS: '+isSecureContext);
</script></body></html>
